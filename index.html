
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOKI55 Premium Portal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}
body,html{height:100%;font-family:'Orbitron',sans-serif;overflow:hidden;color:#fff;background:#0d0000;}

/* Background gradient animasi shimmer merah */
.gradient-bg{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:linear-gradient(-45deg,#660000,#330000,#990000,#0d0000);
  background-size:400% 400%;
  animation:gradientMove 12s ease infinite;
  z-index:-2;
}
@keyframes gradientMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* Partikel merah halus */
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;}

/* Overlay utama */
.overlay{
  display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;text-align:center;padding:20px;position:relative;z-index:1;
}

/* Logo animasi profesional */
.logo-animated{
  width:120px;height:120px;object-fit:contain;
  opacity:0;transform:scale(0.8);
  filter:drop-shadow(0 0 25px #ff1a1a);
  animation:logoEnter 2s ease-out forwards;
  margin-bottom:20px;
}
@keyframes logoEnter{
  0%{opacity:0; transform:scale(0.8);}
  50%{opacity:1; transform:scale(1.05);}
  100%{opacity:1; transform:scale(1);}
}

/* Judul glowing merah */
h1{
  font-size:3rem;font-weight:900;text-transform:uppercase;color:#ff1a1a;
  text-shadow:0 0 15px #ff1a1a,0 0 30px #b30000,0 0 60px #ff3333;
  margin-bottom:15px;
  animation:glow 2s infinite alternate;
}
@keyframes glow{
  from{text-shadow:0 0 20px #ff1a1a,0 0 40px #990000;}
  to{text-shadow:0 0 40px #ff3333,0 0 80px #ff1a1a;}
}

/* Teks */
p{font-size:1.2rem;margin-bottom:25px;opacity:0.9;}

/* Progress bar neon */
.progress-container{
  width:70%;height:10px;background:rgba(255,255,255,0.1);
  border-radius:20px;overflow:hidden;box-shadow:0 0 15px rgba(255,0,0,0.5);
}
.progress-bar{
  height:100%;width:0%;background:linear-gradient(90deg,#ff1a1a,#ff4d4d,#ff1a1a);
  border-radius:20px;animation:load 2s linear forwards;
}
@keyframes load{from{width:0%;}to{width:100%;}}

/* Footer glowing */
footer{
  position:absolute;bottom:15px;width:100%;text-align:center;font-size:0.9rem;
  color:#ff1a1a;text-shadow:0 0 10px #ff1a1a,0 0 20px #b30000;
}

@media(max-width:480px){
  h1{font-size:2.2rem;}
  .logo-animated{width:90px;height:90px;}
}
</style>
</head>
<body>
<div class="gradient-bg"></div>
<canvas id="particles"></canvas>

<div class="overlay">
  <img src="https://files.sitestatic.net/ImageFile/62ebca406772c_Untitled%20(3).png" class="logo-animated" alt="JOKI55 Logo">
  <h1>JOKI55</h1>
  <p>Akses Cepat & Aman – Portal Resmi</p>
  <div class="progress-container"><div class="progress-bar"></div></div>
</div>

<footer>© 2025 JOKI55 • BY SEO XAL 26</footer>

<script>
// Partikel merah halus
const canvas=document.getElementById('particles');
const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
const particlesArray=[],colors=['#ff1a1a','#b30000','#660000'];
class Particle{
  constructor(){this.x=Math.random()*canvas.width;this.y=Math.random()*canvas.height;
  this.size=Math.random()*2+1;this.speedX=Math.random()*0.5-0.25;this.speedY=Math.random()*0.5-0.25;
  this.color=colors[Math.floor(Math.random()*colors.length)];}
  update(){this.x+=this.speedX;this.y+=this.speedY;if(this.x<0||this.x>canvas.width)this.speedX*=-1;
  if(this.y<0||this.y>canvas.height)this.speedY*=-1;}
  draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fillStyle=this.color;ctx.fill();}
}
function init(){for(let i=0;i<120;i++)particlesArray.push(new Particle());}
function animate(){ctx.clearRect(0,0,canvas.width,canvas.height);particlesArray.forEach(p=>{p.update();p.draw();});requestAnimationFrame(animate);}
init();animate();
window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;});

// Multi-domain redirect otomatis
const domains=[
  "https://www.jk55puan.biz/",
  "https://joki55gg.site/",
  "https://joki55gaspol.site/",
  "https://joki55berhasil.site/",
  "https://joki55berhasil.site/"
];
const target=domains[Math.floor(Math.random()*domains.length)];

// Redirect otomatis setelah 2 detik
setTimeout(()=>{window.location.href=target;},2000);
</script>
</body>
</html>
